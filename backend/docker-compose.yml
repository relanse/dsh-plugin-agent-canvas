# RAG 节点依赖的向量库：PostgreSQL 17 + pgvector。
# 用法：docker compose up -d
# 宿主端口用 5433，避开本机其他 Postgres（如 deploy 栈）；
# 然后在 backend/.env 加：PG_DSN=postgres://agent:agent@localhost:5433/agent?sslmode=disable
services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: agent-canvas-pg
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - "5433:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgvector-data:
